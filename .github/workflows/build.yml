name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Unit tests
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage
          if-no-files-found: ignore

  build-android:
    name: Build Android APK + AAB
    needs: analyze-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Build release AAB
        run: flutter build appbundle --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otcms-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: otcms-android-aab
          path: app/build/app/outputs/bundle/release/*.aab

  build-windows:
    name: Build Windows Desktop
    needs: analyze-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath otcms-windows.zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: otcms-windows
          path: app/otcms-windows.zip